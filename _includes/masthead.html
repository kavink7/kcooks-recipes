<header class="masthead">
  <div class="masthead__inner wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3v7a2.5 2.5 0 0 0 5 0V3"/><path d="M8.5 10v11"/>
          <path d="M17.5 3c-1.7 1.6-2.5 3.6-2.5 6s.8 3.5 2.5 3.5S20 11.4 20 9s-.8-4.4-2.5-6Z"/><path d="M17.5 12.5V21"/>
        </svg>
      </span>
      <span class="wordmark__text">{{ site.title }}</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a href="{{ '/recipes/' | relative_url }}"{% if page.url contains '/recipes' %} aria-current="page"{% endif %}>Recipes</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      {%- if site.instagram and site.instagram != '' %}
      <a class="nav__out" href="https://instagram.com/{{ site.instagram }}" rel="me noopener">Instagram</a>
      {%- endif %}
    </nav>

    <button class="themetoggle" type="button" data-theme-toggle aria-label="Switch between light and dark">
      <svg class="themetoggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="themetoggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z"/>
      </svg>
    </button>
  </div>
</header>
