<header class="masthead">
  <div class="masthead__inner wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark__text">{{ site.title }}</span>
      <svg class="wordmark__flourish" viewBox="0 0 142 14" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <path d="M3 9 Q 20 -2 37 9 T 71 9 T 105 9 T 139 9"/>
      </svg>
    </a>

    <nav class="nav" aria-label="Primary">
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/recipes/' | relative_url }}"{% if page.url contains '/recipes' %} aria-current="page"{% endif %}>Recipes</a>
      <a href="{{ '/ingredient-of-the-day/' | relative_url }}"{% if page.url == '/ingredient-of-the-day/' %} aria-current="page"{% endif %}>Ingredients</a>
      {%- if site.instagram and site.instagram != '' %}
      <a class="nav__out" href="https://instagram.com/{{ site.instagram }}" rel="me noopener">Instagram</a>
      {%- endif %}
    </nav>

    <button class="shuffle" type="button" data-random-recipe aria-label="Take me to a random recipe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="4.5"/>
        <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <button class="themetoggle" type="button" data-theme-toggle aria-label="Switch between light and dark">
      <svg class="themetoggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="themetoggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z"/>
      </svg>
    </button>
  </div>
</header>
